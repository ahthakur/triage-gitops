apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
      - name: web
        image: quay.io/nginx/nginx-unprivileged:1.27
        ports:
        - containerPort: 8080
        env:
        - name: GREETING
          value: hello
        resources:
          requests: {cpu: 50m, memory: 32Mi}
          limits: {memory: 64Mi}
